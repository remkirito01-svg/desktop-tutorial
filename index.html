<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi amor ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4, #ff1493);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .carta {
            text-align: center;
            background: rgba(255, 255, 255, 0.25);
            padding: 50px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 30px rgba(255, 0, 100, 0.4);
            z-index: 10;
        }

        h1 {
            color: white;
            font-size: 55px;
            text-shadow: 0 0 15px #ff0066;
            margin-bottom: 20px;
        }

        p {
            color: white;
            font-size: 25px;
        }

        .corazon {
            font-size: 70px;
            animation: latir 1s infinite;
        }

        @keyframes latir {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        .flor {
            position: absolute;
            top: -50px;
            font-size: 30px;
            animation: caer linear infinite;
        }

        @keyframes caer {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .flor:nth-child(1) {
            left: 10%;
            animation-duration: 6s;
        }

        .flor:nth-child(2) {
            left: 25%;
            animation-duration: 8s;
        }

        .flor:nth-child(3) {
            left: 40%;
            animation-duration: 5s;
        }

        .flor:nth-child(4) {
            left: 60%;
            animation-duration: 7s;
        }

        .flor:nth-child(5) {
            left: 75%;
            animation-duration: 6s;
        }

        .flor:nth-child(6) {
            left: 90%;
            animation-duration: 9s;
        }
    </style>
</head>

<body>

    <!-- Flores y rosas cayendo -->
    <div class="flor">🌹</div>
    <div class="flor">🌸</div>
    <div class="flor">🌹</div>
    <div class="flor">🌷</div>
    <div class="flor">🌹</div>
    <div class="flor">🌸</div>

    <!-- Mensaje -->
    <div class="carta">
        <div class="corazon">❤️</div>

        <h1>Te amo mi amor</h1>


    </div>

</body>
</html>
